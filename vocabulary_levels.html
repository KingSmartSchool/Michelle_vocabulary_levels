  <style>
    :root{

      --rose:#c85c70;--shadow:0 16px 38px rgba(31,66,57,.11);
      font-family:system-ui,-apple-system,"Noto Sans TC","Segoe UI",Arial,sans-serif;
    }
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:

    button,select,input{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .shell{width:min(1120px,calc(100% - 28px));margin:auto;padding:20px 0 38px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;display:grid;place-items:center;
      border-radius:15px;background:linear-gradient(145deg,var(--green),#103f3c);color:white;font-size:25px;box-shadow:var(--shadow)}

    .homeLink{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:#ffffffc7;padding:9px 13px;border-radius:999px;font-weight:800}

    .hero:after{content:"ABC";position:absolute;right:4%;bottom:-24px;font-weight:1000;font-size:clamp(70px,13vw,150px);opacity:.07;letter-spacing:-.08em}
    .hero h2{font-size:clamp(27px,5vw,47px);line-height:1.08;margin:0 0 12px;max-width:700px}.hero p{margin:0;opacity:.85;max-width:700px;line-height:1.7}

    .workspace{display:grid;grid-template-columns:250px 1fr;gap:16px;margin-top:16px}.panel{background:rgba(255,253,248,.94);border:1px solid rgba(220,230,225,.9);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
    .sideTitle{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.1em;margin-bottom:8px}.levelTabs{display:grid;gap:8px}.levelTab{border:1px solid var(--line);background:white;border-radius:13px;padding:11px 12px;text-align:left;font-weight:900}.levelTab.active{background:var(--green);border-color:var(--green);color:#fff}

    .progressText{font-size:12px;color:var(--muted);margin-top:6px}.mainTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.eyebrow{font-size:12px;color:var(--green);font-weight:1000;letter-spacing:.12em}.mainTop h2{font-size:clamp(22px,4vw,33px);margin:3px 0 0}.tag{padding:7px 10px;border-radius:999px;background:var(--mint);font-size:12px;font-weight:900;color:var(--green)}
    .modeTabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:13px}.modeBtn{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:12px;font-weight:800;color:var(--muted)}.modeBtn.active{background:var(--ink);border-color:var(--ink);color:white}
    .area{padding-top:18px;min-height:475px}.wordOverview{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}.wordChip{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:white;padding:11px 12px;border-radius:13px}.wordChip b{font-size:16px}.wordChip span{font-size:13px;color:var(--muted);text-align:right}.speakSmall{border:0;background:var(--mint);color:var(--green);width:32px;height:32px;border-radius:50%;flex:0 0 auto}
    .flash{height:255px;perspective:1200px;max-width:630px;margin:0 auto}.flashInner{height:100%;position:relative;transform-style:preserve-3d;transition:.5s;cursor:pointer}.flashInner.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:23px;display:grid;place-items:center;text-align:center;padding:25px;background:linear-gradient(150deg,#fff,#f4faf7)}.face.back{transform:rotateY(180deg);background:linear-gradient(150deg,#173d3a,#1d756c);color:white}.face strong{font-size:clamp(31px,6vw,52px)}.face span{display:block;color:var(--muted);font-size:13px;margin-top:8px}.face.back span{color:#d4e9e4}.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px;font-weight:850;color:var(--ink)}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.gold{background:var(--gold);border-color:var(--gold);color:#2d2514}.btn:disabled{opacity:.45;cursor:not-allowed}

    .tinyNote{font-size:12px;color:var(--muted);text-align:center;margin-top:15px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
    @media(max-width:800px){.levels{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.side .levelTabs{grid-column:1/-1;grid-template-columns:repeat(3,1fr)}.levelTab{text-align:center}.sideTitle{grid-column:1/-1}.area{min-height:410px}}

  </style>
</head>

<div class="shell">
  <header>
    <div class="brand"><div class="logo">📚</div><div><h1>每日單字練習站</h1><div class="subtitle">Movers・Flyers・KET 一站完成</div></div></div>

  <section id="landing">

  <section id="app" class="workspace hidden">

    </aside>

    <main class="panel">
      <div class="mainTop"><div><div class="eyebrow" id="levelName"></div><h2 id="dayTitle"></h2></div><span class="tag" id="wordCount"></span></div>
      <div class="modeTabs">
        <button class="modeBtn active" data-mode="learn">翻卡學習</button>
        <button class="modeBtn" data-mode="en2zh">英選中</button>
        <button class="modeBtn" data-mode="zh2en">中選英</button>
        <button class="modeBtn" data-mode="listen">聽音拼字</button>
        <button class="modeBtn" data-mode="spell">看中拼英</button>
      </div>
      <div class="area" id="area"></div>
    </main>
  </section>
  <div class="footer">學英語找 Michelle・學習紀錄只保存在目前使用的瀏覽器</div>
</div>

"}]},{"day":85,"theme":"Road travel｜When the Car Breaks Down","words":[{"en":"garage","zh":"車庫；修車廠"},{"en":"gas","zh":"煤氣；汽油（美式）"},{"en":"gas station","zh":"加油站（美式）"},{"en":"petrol","zh":"汽油（英式）"},{"en":"petrol station","zh":"加油站（英式）"},{"en":"break down","zh":"發生故障；拋錨"}]},{"day":86,"theme":"Directions｜Finding the Right Way","words":[{"en":"left-hand","zh":"左邊的；左手的"},{"en":"side","zh":"側面；一邊"},{"en":"further","zh":"更遠的；進一步"},{"en":"kilometre (km)","zh":"公里"},{"en":"mile","zh":"英里"},{"en":"lost","zh":"迷路的；丟失的"}]},{"day":87,"theme":"Tourism｜A Day of Sightseeing","words":[{"en":"sightseeing","zh":"觀光"},{"en":"tour guide","zh":"導遊"},{"en":"tourist information centre","zh":"遊客資訊中心"},{"en":"capital","zh":"首都；大寫字母"},{"en":"city centre","zh":"市中心"},{"en":"port","zh":"港口"}]},{"day":88,"theme":"Safety & police｜A Mistake Near the Station","words":[{"en":"police","zh":"警察"},{"en":"police car","zh":"警車"},{"en":"steal","zh":"偷；竊取"},{"en":"sign","zh":"標誌；招牌"},{"en":"by accident","zh":"意外地；偶然"},{"en":"luckily","zh":"幸運地；幸好"}]},{"day":89,"theme":"Food & work｜A Crowded Restaurant","words":[{"en":"chef","zh":"廚師"},{"en":"waitress","zh":"女服務員"},{"en":"steak","zh":"牛排"},{"en":"slice","zh":"薄片；切片"},{"en":"refrigerator","zh":"冰箱（美式）"},{"en":"crowded","zh":"擁擠的"}]},{"day":90,"theme":"People｜People We Meet","words":[{"en":"anybody","zh":"任何人"},{"en":"nobody","zh":"沒有人"},{"en":"housewife","zh":"家庭主婦"},{"en":"guy","zh":"傢伙；男士"},{"en":"Ms","zh":"女士（不說明婚姻狀況）"},{"en":"pet","zh":"寵物"}]},{"day":91,"theme":"Measurements｜Measuring a Project","words":[{"en":"centimetre (cm)","zh":"釐米"},{"en":"gram","zh":"克"},{"en":"metre","zh":"米"},{"en":"length","zh":"長度"},{"en":"per","zh":"每；每一"},{"en":"dot","zh":"點；小圓點"}]},{"day":92,"theme":"Numbers & amounts｜Comparing Amounts","words":[{"en":"plus","zh":"加；再加上"},{"en":"minus","zh":"減；負的"},{"en":"few","zh":"少數；幾個"},{"en":"less","zh":"更少的；較少"},{"en":"least","zh":"最少；最小"},{"en":"extra","zh":"額外的"}]},{"day":93,"theme":"Types & groups｜Sorting a Collection","words":[{"en":"sort","zh":"種類；分類"},{"en":"variety","zh":"多樣；種類"},{"en":"various","zh":"各種各樣的"},{"en":"similar","zh":"相似的"},{"en":"whole","zh":"整個的；全部"},{"en":"among","zh":"在...之中"}]},{"day":94,"theme":"Frequency & degree｜How Often and How Much","words":[{"en":"almost","zh":"幾乎；差不多"},{"en":"nearly","zh":"幾乎"},{"en":"every","zh":"每一個"},{"en":"exactly","zh":"確切地；正是"},{"en":"usual","zh":"平常的；通常的"},{"en":"certainly","zh":"當然；肯定地"}]},{"day":95,"theme":"Grammar in context｜Linking Ideas Clearly","words":[{"en":"as well (as)","zh":"以及；也"},{"en":"because of","zh":"因為；由於"},{"en":"however","zh":"然而；無論如何"},{"en":"instead of","zh":"代替；而不是"},{"en":"even","zh":"甚至；即使"},{"en":"especially","zh":"尤其；特別"}]},{"day":96,"theme":"Everyday communication｜A Friendly Conversation","words":[{"en":"Guess what?","zh":"你猜怎麼著"},{"en":"hey","zh":"嘿；嗨"},{"en":"of course (not)","zh":"當然不"},{"en":"Yeah!","zh":"是的；對"},{"en":"like","zh":"喜歡；像"},{"en":"clearly","zh":"清楚地"}]},{"day":97,"theme":"Actions in context｜Exploring a New Place","words":[{"en":"come back","zh":"回來"},{"en":"get back","zh":"回來；取回"},{"en":"continue","zh":"繼續"},{"en":"enter","zh":"進入；參加"},{"en":"discover","zh":"發現"},{"en":"discuss","zh":"討論"}]},{"day":98,"theme":"Reading & writing｜A Story from Memory","words":[{"en":"writer","zh":"作家；作者"},{"en":"topic","zh":"主題；話題"},{"en":"memory","zh":"記憶；回憶"},{"en":"that (conjunction)","zh":"（連接詞）表示“……”"},{"en":"suppose","zh":"認為；猜想"},{"en":"seem","zh":"似乎；好像"}]},{"day":99,"theme":"Work & routines｜An After-school Job","words":[{"en":"p.m","zh":"下午；晚上"},{"en":"have to","zh":"必須；不得不"},{"en":"sit down","zh":"坐下"},{"en":"earn","zh":"賺得；獲得"},{"en":"lend","zh":"借給"},{"en":"except","zh":"除……以外"}]},{"day":100,"theme":"Problems & outcomes｜The Missing Sports Kit","words":[{"en":"kit","zh":"裝備；套件"},{"en":"luck","zh":"運氣"},{"en":"pity","zh":"遺憾；同情"},{"en":"shame","zh":"羞愧；遺憾的事"},{"en":"unfortunately","zh":"不幸的是"},{"en":"die","zh":"死亡；消失"}]}]}};
const META={
  movers:{icon:"🌱",desc:"建立 A1 日常字彙基礎",tone:"#2d8b65"},
  flyers:{icon:"🪽",desc:"拓展 A2 兒童生活與閱讀字彙",tone:"#3d70ad"},
  ket:{icon:"🚀",desc:"銜接 A2 Key 真實情境與考試字彙",tone:"#a45b65"}
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={level:"movers",day:0,mode:"learn",index:0,order:[],score:0,answered:0,locked:false,misses:[]};
const storageKey="michelle-vocab-progress-v1";
let progress=JSON.parse(localStorage.getItem(storageKey)||"{}");
const unit=()=>DATA[state.level].units[state.day];
const words=()=>unit().words;
const shuffled=a=>{const b=[...a];for(let i=b.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const escapeHtml=s=>String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/\s*\([^)]*\)/g,""));u.lang="en-GB";u.rate=.82;speechSynthesis.speak(u)}
function saveProgress(){localStorage.setItem(storageKey,JSON.stringify(progress));updateProgress()}
function markDone(){const key=`${state.level}-${state.day}`;progress[key]=Math.max(progress[key]||0,Math.round(state.score/state.answered*100)||0);saveProgress()}

function init(){
  $("#levelCards").innerHTML=Object.entries(DATA).map(([key,l])=>{const total=l.units.reduce((n,u)=>n+u.words.length,0);return `<button class="levelCard" data-open="${key}" style="border-top:5px solid ${META[key].tone}"><span class="cefr">${l.cefr}</span><b>${META[key].icon} ${l.label}</b><p>${META[key].desc}</p><span class="count">${l.units.length} Days・${total} 個詞彙</span></button>`}).join("");
  $("#levelTabs").innerHTML=Object.entries(DATA).map(([key,l])=>`<button class="levelTab" data-level="${key}">${META[key].icon} ${l.label}</button>`).join("");
  $$('[data-open]').forEach(b=>b.onclick=()=>openLevel(b.dataset.open));
  $$('[data-level]').forEach(b=>b.onclick=()=>changeLevel(b.dataset.level));
  $$(".modeBtn").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;resetRound();render()});
  $("#daySelect").onchange=e=>{state.day=Number(e.target.value);state.mode="learn";resetRound();sync();render()};
  $("#backLanding").onclick=()=>{$("#app").classList.add("hidden");$("#landing").classList.remove("hidden")};
}
function openLevel(key){state.level=key;state.day=Number(localStorage.getItem(`last-${key}`)||0);if(state.day>=DATA[key].units.length)state.day=0;state.mode="learn";resetRound();$("#landing").classList.add("hidden");$("#app").classList.remove("hidden");sync();render();scrollTo({top:0,behavior:"smooth"})}
function changeLevel(key){state.level=key;state.day=Number(localStorage.getItem(`last-${key}`)||0);if(state.day>=DATA[key].units.length)state.day=0;state.mode="learn";resetRound();sync();render()}
function sync(){
  localStorage.setItem(`last-${state.level}`,state.day);
  const l=DATA[state.level],u=unit();
  $("#daySelect").innerHTML=l.units.map((x,i)=>`<option value="${i}" ${i===state.day?"selected":""}>${l.label} Day ${x.day}</option>`).join("");
  $("#themeText").textContent=u.theme;$("#levelName").textContent=`${l.cefr}・${l.label}`;$("#dayTitle").textContent=`${l.label} Day ${u.day}`;$("#wordCount").textContent=`${u.words.length} WORDS`;
  $$('[data-level]').forEach(b=>b.classList.toggle("active",b.dataset.level===state.level));
  $$(".modeBtn").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode));updateProgress();
}
function updateProgress(){const l=DATA[state.level],done=l.units.filter((_,i)=>progress[`${state.level}-${i}`]>=60).length,pct=Math.round(done/l.units.length*100);$("#progressBar").style.width=pct+"%";$("#progressText").textContent=`已完成 ${done} / ${l.units.length} 回（${pct}%）`}
function resetRound(){state.index=0;state.order=shuffled(words().map((_,i)=>i));state.score=0;state.answered=0;state.locked=false;state.misses=[]}
function overview(){return `<div class="wordOverview">${words().map(w=>`<div class="wordChip"><div><b>${escapeHtml(w.en)}</b><span>　${escapeHtml(w.zh)}</span></div><button class="speakSmall" data-speak="${escapeHtml(w.en)}">🔊</button></div>`).join("")}</div>`}
function render(){sync();state.mode==="learn"?renderLearn():renderQuestion()}
function renderLearn(){const w=words()[state.index];$("#area").innerHTML=`${overview()}<div class="flash"><div class="flashInner" id="flash"><div class="face"><div><strong>${escapeHtml(w.en)}</strong><span>點一下翻到中文</span></div></div><div class="face back"><div><strong>${escapeHtml(w.zh)}</strong><span>${escapeHtml(w.en)}</span></div></div></div></div><div class="nav"><button class="btn" id="prev">← 上一個</button><button class="btn primary" id="say">🔊 發音</button><button class="btn" id="flip">翻面</button><button class="btn" id="next">下一個 →</button></div><div class="tinyNote">第 ${state.index+1} / ${words().length} 個・先看完整單字表，再用翻卡加深記憶</div>`;
  $("#flash").onclick=()=>$("#flash").classList.toggle("flipped");$("#flip").onclick=()=>$("#flash").classList.toggle("flipped");$("#say").onclick=()=>speak(w.en);$("#prev").onclick=()=>{state.index=(state.index-1+words().length)%words().length;renderLearn()};$("#next").onclick=()=>{state.index=(state.index+1)%words().length;renderLearn()};$$('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));
}
function currentWord(){return words()[state.order[state.index]]}
function distractors(correct,field){const pool=DATA[state.level].units.flatMap(u=>u.words).filter(w=>w[field]!==correct[field]);return shuffled(pool).slice(0,3)}
function renderQuestion(){if(state.index>=state.order.length){renderResult();return}state.locked=false;const w=currentWord();if(state.mode==="en2zh"||state.mode==="zh2en"){const from=state.mode==="en2zh"?"en":"zh",to=state.mode==="en2zh"?"zh":"en",opts=shuffled([w,...distractors(w,to)]);$("#area").innerHTML=`<div class="questionHead"><small>第 ${state.index+1} / ${words().length} 題</small><div class="prompt">${escapeHtml(w[from])}</div></div><div class="choices">${opts.map(o=>`<button class="choice" data-answer="${escapeHtml(o[to])}">${escapeHtml(o[to])}</button>`).join("")}</div><div class="feedback" id="feedback"></div><div class="nav"><button class="btn" id="skip">跳過這題</button></div>`;$$('[data-answer]').forEach(b=>b.onclick=()=>answerChoice(b,b.dataset.answer===w[to],w[to]));$("#skip").onclick=()=>finishAnswer(false,w[to]);return}
  const listening=state.mode==="listen";$("#area").innerHTML=`<div class="questionHead"><small>第 ${state.index+1} / ${words().length} 題</small>${listening?`<button class="listenPrompt" id="listenBtn">🔊</button><div class="tinyNote">聽發音，輸入完整英文</div>`:`<div class="prompt">${escapeHtml(w.zh)}</div>`}</div><div class="spellBox"><input id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="請輸入英文答案"><button class="btn primary" id="submitSpell">送出答案</button></div><div class="feedback" id="feedback"></div><div class="nav"><button class="btn" id="showAnswer">顯示答案</button></div>`;if(listening){$("#listenBtn").onclick=()=>speak(w.en);setTimeout(()=>speak(w.en),180)}$("#submitSpell").onclick=submitSpell;$("#spellInput").onkeydown=e=>{if(e.key==="Enter")submitSpell()};$("#showAnswer").onclick=()=>finishAnswer(false,w.en);$("#spellInput").focus()
}
function answerChoice(button,ok,answer){if(state.locked)return;state.locked=true;button.classList.add(ok?"correct":"wrong");if(!ok)$$('[data-answer]').find(b=>b.dataset.answer===answer)?.classList.add("correct");$("#feedback").textContent=ok?"✅ 答對了！":"❌ 正確答案："+answer;record(ok);setTimeout(nextQuestion,850)}
function normalAnswer(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/\s*\([^)]*\)/g,"").replace(/[^a-z0-9']+/g," ").trim()}
function submitSpell(){if(state.locked)return;const input=$("#spellInput").value,w=currentWord(),ok=normalAnswer(input)===normalAnswer(w.en);state.locked=true;$("#spellInput").style.borderColor=ok?"#42a364":"#df7180";$("#feedback").textContent=ok?"✅ 拼對了！":"❌ 正確答案："+w.en;record(ok);setTimeout(nextQuestion,1050)}
function finishAnswer(ok,answer){if(state.locked)return;state.locked=true;$("#feedback").textContent="正確答案："+answer;record(ok);setTimeout(nextQuestion,1050)}
function record(ok){state.answered++;if(ok)state.score++;else state.misses.push(currentWord())}
function nextQuestion(){state.index++;renderQuestion()}
function renderResult(){markDone();const pct=Math.round(state.score/state.answered*100)||0,comment=pct===100?"太厲害了，全部答對！":pct>=80?"表現很好，再複習錯題就更穩了。":pct>=60?"已經掌握大半，建議再練一次。":"先回翻卡模式複習，再挑戰一次吧！";$("#area").innerHTML=`<div class="result"><div class="ring" style="--score:${pct*3.6}deg"><strong>${pct}%</strong></div><h3>${state.score} / ${state.answered} 題正確</h3><p>${comment}</p>${state.misses.length?`<div class="wordOverview" style="margin-top:18px">${state.misses.map(w=>`<div class="wordChip"><b>${escapeHtml(w.en)}</b><span>${escapeHtml(w.zh)}</span></div>`).join("")}</div>`:""}<div class="nav"><button class="btn" id="review">回去翻卡</button><button class="btn primary" id="again">再測一次</button><button class="btn gold" id="nextDay">下一回 →</button></div></div>`;$("#review").onclick=()=>{state.mode="learn";resetRound();render()};$("#again").onclick=()=>{resetRound();render()};$("#nextDay").onclick=()=>{state.day=(state.day+1)%DATA[state.level].units.length;resetRound();sync();render()}}
init();
</script>
